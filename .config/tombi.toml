[format.rules]
line-width = 80

[[schemas]]
path = "https://docs.cocogitto.io/cog-schema.json"
include = ["cog.toml"]

[[schemas]]
path = "https://schemastore.org/treefmt.json"
include = ["treefmt.toml"]

[[schemas]]
path = "https://www.schemastore.org/ryl.json"
include = ["ryl.toml"]

[[schemas]]
path = "https://mise.jdx.dev/schema/mise.json"
# tombi: format.rules.array-values-order = "ascending"
include = [
  "**/.config/mise/config.toml",
  "**/.mise.toml",
  "**/mise.toml",
  ".config/mise/config.toml",
  ".mise.toml",
  "mise.toml"
]

[[schemas]]
root = "tasks"
path = "https://mise.jdx.dev/schema/mise-task.json"
# tombi: format.rules.array-values-order = "ascending"
include = [
  "**/.config/mise/config.toml",
  "**/.mise.toml",
  "**/mise.toml",
  ".config/mise/config.toml",
  ".mise.toml",
  "mise.toml"
]

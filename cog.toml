branch_whitelist = []
disable_bump_commit = false
disable_changelog = true
from_latest_tag = false
generate_mono_repository_global_tag = true
generate_mono_repository_package_tags = true
ignore_fixup_commits = false
ignore_merge_commits = true
post_bump_hooks = ["git tag {{version_tag}} {{version_tag}}^{} --force --sign"]
post_package_bump_hooks = []
pre = "alpha.*"
pre_bump_hooks = [
  "echo 'bumping from {{latest_tag|0.0.0}} to {{version_tag|0.0.1}}'",
  "bun pm version {{version}} --no-git-tag-version",
  "uv version --frozen {{version}}",
  "bunx git-cliff -o CHANGELOG.md --tag {{version_tag}}",
  "hk fix CHANGELOG.md"
]
pre_package_bump_hooks = []
# tombi: format.rules.array-values-order = "ascending"
scopes = [
  "chezmoi",
  "cocogitto",
  "copier",
  "cspell",
  "git",
  "github",
  "hk",
  "jscpd",
  "kde",
  "megalinter",
  "mise",
  "nix",
  "opencode",
  "package",
  "packages",
  "pre-commit",
  "prettier",
  "script",
  "soar",
  "treefmt",
  "version",
  "vscode",
  "zed"
]
skip_ci = "[skip ci]"
skip_untracked = false
tag_prefix = "v"

[changelog]
authors = [{ signature = "ask.mrdgh2821@outlook.com", username = "MRDGH2821" }]
owner = "MRDGH2821"
path = "CHANGELOG.md"
remote = "github.com"
repository = "dotfiles"
template = "remote"

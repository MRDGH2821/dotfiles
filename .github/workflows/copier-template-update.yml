---
jobs:
  issue:
    if: needs.preview.outputs.update_available == 'true'
    name: Open or refresh update issue
    needs: preview
    permissions:
      contents: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: copier-update-preview
          path: ${{ runner.temp }}/copier-update-preview
      - env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        name: Open or refresh issue
        run: |-
          set -euo pipefail
          title="Copier template update available"
          issue=$(gh issue list --repo "${GITHUB_REPOSITORY}" --state open --search "in:title ${title}" --json number,title --jq '.[] | select(.title == "Copier template update available") | .number' | head -n 1)
          if [[ -n "${issue}" ]]; then
            gh issue edit "${issue}" --repo "${GITHUB_REPOSITORY}" --body-file "${RUNNER_TEMP}/copier-update-preview/copier-preview.md"
          else
            gh issue create --repo "${GITHUB_REPOSITORY}" --title "${title}" --body-file "${RUNNER_TEMP}/copier-update-preview/copier-preview.md"
          fi
  preview:
    name: Preview Copier update
    outputs:
      update_available: ${{ steps.preview.outputs.update_available }}
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          cache: false
          install: false
      - id: preview
        name: Preview the latest template
        run: |
          set -euo pipefail
          preview_dir="${RUNNER_TEMP}/copier-preview"
          git worktree add --detach "${preview_dir}" "${GITHUB_SHA}"
          cd "${preview_dir}"
          mise install uv
          mise exec uv -- uvx --from copier copier update --defaults --skip-tasks --trust
          git add -N -A
          if git diff --quiet "${GITHUB_SHA}" --; then
            echo "update_available=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          patch="${RUNNER_TEMP}/copier-update.patch"
          git diff --no-ext-diff --unified=3 "${GITHUB_SHA}" -- > "${patch}"
          patch_size=$(wc -c < "${patch}")
          {
            echo "The latest Copier template would change this generated project."
            echo
            echo "## Changed files"
            git diff --stat "${GITHUB_SHA}"
            echo
            echo "## Potential changes"
            echo '```diff'
            if [[ "${patch_size}" -gt 45000 ]]; then
              head -c 45000 "${patch}"
              echo
              echo "[Diff truncated at 45 KB.]"
            else
              cat "${patch}"
            fi
            echo '```'
          } > "${RUNNER_TEMP}/copier-preview.md"
          echo "update_available=true" >> "${GITHUB_OUTPUT}"
      - if: steps.preview.outputs.update_available == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          if-no-files-found: error
          name: copier-update-preview
          path: ${{ runner.temp }}/copier-preview.md
name: Copier Template Update
on: # yamllint disable-line rule:truthy
  schedule:
    - cron: 0 9 * * 1
  workflow_dispatch:
permissions: {}

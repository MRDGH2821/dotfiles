[commands]
"Antidot rules" = "antidot update"
"Install-Release Pkgs Upgrade" = "ir upgrade --pkg -y"
"Install-Release Upgrade" = "ir upgrade -y"

[firmware]
upgrade = true

[git]
max_concurrency = 1
# tombi: format.rules.array-values-order = "ascending"
repos = ["~/Projects/*/*"]

[misc]
cleanup = true
disable = ["containers"]
no_self_update = true
notify_each_step = false

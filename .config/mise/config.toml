[deps.bun]
auto = true

[deps.capabilities]
description = "Install Agent plugins"
# tombi: format.rules.array-values-order = "ascending"
outputs = [
  ".agents/skills/",
  ".claude/",
  ".codex/",
  ".cursor/",
  ".kiro/",
  ".mcp.json",
  "capabilities.lock",
  "opencode.json"
]
run = "capa install --yes"
# tombi: format.rules.array-values-order = "ascending"
sources = [
  ".config/capabilities/",
  "capabilities.yaml",
  "template/.config/capabilities/"
]

[deps.uv]
auto = true

[env]
HK_MISE = 1

[hooks]
# Automatically install/update hooks when tools are installed
postinstall = ["hk install --mise"]

[settings]
experimental = true
lockfile = true
lockfile_auto_prune = true

[settings.github]
use_git_credentials = true

[tasks]
ai-setup = "capa install --yes"
check = ["hk check --all", "cog check"]
prepare-ci = ["bun ci"]

[tasks.format]
alias = "fmt"
run = ["hk fix --all"]

[tasks.generate-package-tables]
depends_post = [{ task = "format" }]
run = "uv run gen-packages-table"
sources = ["**/packages/**"]

[tasks.prepare]
interactive = true
run = ["bun install", { task = "ai-setup" }]

[tools]
"aqua:google/keep-sorted" = "0.10.0"
"aqua:owenlamont/ryl" = "0.28.0"
betterleaks = "1.9.0"
bun = "1.4.4"
cocogitto = "7.0.0"
cspell = "10.4.0"
editorconfig-checker = "4.0.2"
gh = "2.103.3"
git-cliff = "2.14.2"
"github:MRDGH2821/Sort-Markdown-Tables" = "0.6.0"
"github:infragate/capa" = "2.4.0"
hk = { version = "2.11.0", workflow = "release.yml" }
ls-lint = "2.3.2"
oxfmt = "0.75.0"
pkl = "0.32.2"
"pypi:lorenzwalthert/gitignore-tidy" = "latest"
"pypi:toml-sort" = "0.25.0"
python = "latest"
ruff = "0.17.3"
rumdl = "0.3.2"
tombi = "1.9.8"
typos = "1.52.0"
uv = "0.13.6"
yq = "4.54.1"

[[watch_files]]
patterns = ["capabilities.yaml"]
task = "ai-setup"

[[watch_files]]
patterns = ["**/packages/**"]
task = "generate-package-tables"

---
# yaml-language-server: $schema=https://raw.githubusercontent.com/infragate/capa/main/schema/capabilities.schema.json
agents:
  additional:
    - id: template-context
      path: .config/capabilities/instructions/template.md
      type: local
  base:
    path: .config/capabilities/instructions/project.md
    type: local
options:
  agentActivity: true
  requiresCommands: []
  toolExposure: search
plugins:
  - def:
      description: Matt Pocock's agent skills for real engineering (grilling, spec/ticket flows, TDD, code review, domain modelling and more).
      repo: mattpocock/skills
    id: mattpocock-skills
    type: github
  - def:
      description: "Core skills library: TDD, debugging, collaboration patterns, and proven techniques"
      repo: obra/superpowers
    id: superpowers
    type: github
  - def:
      description: Architecture analysis, code quality, and development workflow skills by Ovid
      repo: Ovid/paad::plugins/paad
    id: paad
    type: github
  - def:
      description: "Set up, run and fix MegaLinter on any repository: 100+ linters for 69+ languages, 23+ formats and 21+ tooling formats, from CI or locally."
      repo: oxsecurity/megalinter
    id: megalinter
    type: github
providers:
  # keep-sorted start
  - antigravity
  - claude-code
  - codex
  - cursor
  - opencode
  # keep-sorted end
rules:
  - def:
      repo: multica-ai/andrej-karpathy-skills::.cursor/rules/karpathy-guidelines.mdc
    description: Andrej Karpathy's Guidelines
    id: karpathy-guidelines
    type: github
  - description: Engineering workflow and change discipline
    id: engineering
    path: .config/capabilities/rules/engineering.md
    type: local
  - alwaysApply: true
    description: Branch naming and atomic Conventional Commits
    id: commits
    path: .config/capabilities/rules/commits.md
    type: local
  - alwaysApply: true
    description: Where to save AI-generated artifacts
    id: ai-artifacts
    path: .config/capabilities/rules/ai-artifacts.md
    type: local
servers:
  - def:
      args:
        - mcp
      cmd: hk
    description: hk gives coding agents a narrow, inspectable way to run project checks and fixes.
    id: hk
    type: mcp
  - def:
      args:
        - mcp
      cmd: mise
      env:
        MISE_EXPERIMENTAL: "1"
    description: The mise MCP server lets an AI assistant inspect a project's tools, tasks, environment, and configuration, and run mise tasks.
    id: mise
    type: mcp
skills:
  - def:
      description: Guide for managing capabilities with capa CLI
      repo: infragate/capa@capabilities-manager
    id: capabilities-manager
    type: github
  - def:
      description: "Capify an existing project: discover skills/rules/hooks/MCP servers across all providers and synthesize capabilities.yaml"
      repo: infragate/capa@bootstrap
    id: bootstrap
    type: github
  - def:
      repo: github/awesome-copilot@git-commit
    id: git-commit
    type: github
  - def:
      repo: cli/cli@gh
    id: gh
    type: github
  - def:
      repo: nullswan/atomic-commits@atomic-commits
    id: atomic-commits
    type: github
tools: []

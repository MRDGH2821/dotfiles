[tools.cursor-agent]
bin_path = "dist-package"
strip_components = 0
url = "https://downloads.cursor.com/lab/{{ version }}/{{ os(macos=\"darwin\") }}/{{ arch(x64=\"x64\", arm64=\"arm64\") }}/agent-cli-package.tar.gz"
version = "latest"
version_list_url = "https://cursor.com/install"
version_regex = 'downloads\.cursor\.com/lab/([0-9]{4}\.[0-9]{2}\.[0-9]{2}-[0-9a-f]+)/'

[tools."llama.cpp"]
prerelease = true
version = "latest"
version_prefix = "b"

[tools.oh-my-pi]
rename_exe = "omp"
version = "18.8.4"

[tools.packslip]
identity_prefix = "https://github.com/jdx/packslip/.github/workflows/release.yml@"
issuer = "https://token.actions.githubusercontent.com"
list_identity_prefix = "https://github.com/jdx/packslip/.github/workflows/packslip-releases.yml@"
version = "latest"

<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Zed (cosmic-text) cannot render COLRv1 emoji fonts; see
  https://github.com/zed-industries/zed/issues/42255

  Fedora 43+ ships Noto Color Emoji only as Noto-COLRv1.ttf. Reject it so the
  CBDT bitmap NotoColorEmoji.ttf managed by chezmoi in
  ~/.local/share/fonts is used instead. User-level only; no system
  files are modified.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <!-- Only the system COLRv1 build of Noto Color Emoji any other COLRv1 font elsewhere stays selectable. -->
      <glob>/usr/share/fonts/google-noto-color-emoji-fonts/*COLRv1*</glob>
    </rejectfont>
  </selectfont>
</fontconfig>
